    <main>
 <section id="event-container" class="event-container">
      <!-- Events will be dynamically injected here -->
    </section>
    <button id="addEventButton" class="add-event-button">Add Event</button>

    <!-- Dialog for Adding New Event -->
    <dialog id="eventDialog">
      <form id="eventForm">
        <h2>Add New Event</h2>
        <label for="eventName">Event Name:</label>
        <input type="text" id="eventName" required>
        <label for="eventDate">Event Date:</label>
        <input type="date" id="eventDate" required>
        <label for="eventLocation">Event Location:</label>
        <input type="text" id="eventLocation" required>
        <label for="eventDescription">Event Description:</label>
        <textarea id="eventDescription" required></textarea>
        <button type="submit">Add Event</button>
        <button type="button" id="closeDialogButton">Cancel</button>
      </form>
    </dialog>
